<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b3c5d">
<title>釣りポイント計算</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: #eef4f8; color: #14212b;
    touch-action: manipulation; -webkit-text-size-adjust: 100%;
  }
  button { font-family: inherit; border: none; cursor: pointer; }

  /* ===== 見出し ===== */
  .head { background: #0b3c5d; color: #fff; padding: 14px 16px 16px; text-align: center; }
  .head h1 { margin: 0; font-size: 22px; letter-spacing: .04em; }
  .head p { margin: 6px 0 0; font-size: 14px; opacity: .85; }

  /* ===== 所持ポイント入力 ===== */
  .ownbox { margin: -8px 12px 0; background: #fff; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.1); overflow: hidden; }
  .ownbox button { width: 100%; background: #fff; padding: 14px 16px; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ownbox .l { font-size: 16px; font-weight: 700; color: #33566d; }
  .ownbox .l small { display: block; font-size: 12px; font-weight: 400; color: #8ba0af; margin-top: 3px; }
  .ownbox .v { font-size: 34px; font-weight: 800; color: #0b3c5d; white-space: nowrap; }
  .ownbox .v em { font-size: 16px; font-style: normal; margin-left: 3px; }
  .ownbox .v .tap { font-size: 15px; font-weight: 700; color: #fff; background: #1f7ab5; border-radius: 8px; padding: 8px 14px; }

  /* ===== 残ポイント ===== */
  .board { background: #fff; margin: 12px; border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.1); text-align: center; }
  .board .lbl { font-size: 15px; color: #5b7385; font-weight: 700; }
  .board .num { font-size: 68px; font-weight: 800; line-height: 1.05; color: #0b7a3b; margin-top: 4px; }
  .board .num .u { font-size: 22px; font-weight: 700; margin-left: 4px; }
  .board .sub { font-size: 14px; color: #7a8fa0; margin-top: 6px; }
  .board.short .num { color: #c62828; }
  .board .callout { display: none; margin-top: 12px; background: #fdecea; color: #b0392f; border-radius: 10px; padding: 12px; font-size: 16px; font-weight: 700; line-height: 1.5; }
  .board.short .callout { display: block; }

  /* ===== 魚ボタン ===== */
  .sect { font-size: 14px; color: #5b7385; font-weight: 700; margin: 0 14px 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; padding: 0 12px 12px; }
  .fish {
    background: #fff; border-radius: 14px; box-shadow: 0 2px 6px rgba(0,0,0,.08);
    padding: 16px 10px; text-align: center;
  }
  .fish.over { opacity: .45; }
  .fish .nm { font-size: 22px; font-weight: 800; }
  .fish .pt { display: block; margin-top: 6px; font-size: 15px; font-weight: 700; color: #fff; background: #1f7ab5; border-radius: 999px; padding: 5px 0; }
  .fish.cst .pt { background: #7a5ea8; font-size: 13px; }
  .fish:active { filter: brightness(.94); }

  /* ===== 選んだ内訳 ===== */
  .listwrap { padding: 0 12px 96px; }
  .item { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .item .t { flex: 1; font-size: 19px; font-weight: 700; }
  .item .t small { display: block; font-size: 14px; font-weight: 600; color: #46789a; margin-top: 3px; }
  .item .t small.non { color: #b58a2b; }
  .item .p { font-size: 19px; font-weight: 800; color: #1f7ab5; white-space: nowrap; }
  .item .del { background: #f2f5f7; color: #b0392f; font-size: 20px; font-weight: 800; border-radius: 10px; padding: 8px 16px; }
  .empty { color: #8ba0af; text-align: center; padding: 20px 0; font-size: 15px; line-height: 1.6; }

  /* ===== 下部バー ===== */
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 8px; background: rgba(238,244,248,.96); border-top: 1px solid #d6e2ea; }
  .bottom button { flex: 1; padding: 16px 4px; font-size: 17px; font-weight: 800; border-radius: 12px; background: #fff; color: #14212b; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .bottom button.main { background: #0b3c5d; color: #fff; }

  /* ===== モーダル ===== */
  .mask { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; padding: 12px; z-index: 50; }
  .mask.on { display: flex; }
  .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 460px; max-height: 92%; overflow: auto; padding: 16px; }
  .modal h2 { margin: 0 0 4px; font-size: 22px; }
  .modal .hint { margin: 0 0 12px; font-size: 14px; color: #5b7385; line-height: 1.6; }
  .modal .row { display: flex; gap: 8px; margin-top: 10px; }
  .modal .row button { flex: 1; padding: 14px; font-size: 18px; font-weight: 800; border-radius: 12px; background: #eef4f8; }
  .modal .row button.ok { background: #0b3c5d; color: #fff; }
  .modal .row button.ok[disabled] { background: #c3d2dc; }

  /* 調理法チップ */
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .chips button {
    padding: 16px 6px; font-size: 17px; font-weight: 700; border-radius: 12px;
    background: #eef4f8; color: #14212b; border: 2px solid #eef4f8;
  }
  .chips button.sel { background: #1f7ab5; border-color: #0b3c5d; color: #fff; }
  .chips button.sel:before { content: "✓ "; }
  .preview {
    margin-top: 12px; background: #f2f7fa; border-radius: 12px; padding: 12px;
    text-align: center; font-size: 19px; font-weight: 800; color: #0b3c5d; min-height: 54px;
  }
  .preview small { display: block; font-size: 13px; font-weight: 600; color: #7a8fa0; margin-top: 4px; }

  .disp { font-size: 44px; font-weight: 800; text-align: right; padding: 10px 14px; background: #f2f7fa; border-radius: 12px; min-height: 64px; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .pad button { padding: 20px 0; font-size: 26px; font-weight: 800; border-radius: 12px; background: #eef4f8; }
  .pad button.act { background: #dce9f2; }

  .fset { border: 1px solid #dbe6ee; border-radius: 12px; padding: 10px; margin-bottom: 8px; }
  .fset .l1 { display: flex; gap: 6px; align-items: center; }
  .fset input[type=text] { flex: 1; font-size: 17px; padding: 8px; border: 1px solid #cbd8e2; border-radius: 8px; min-width: 0; }
  .fset input[type=number] { width: 76px; font-size: 17px; padding: 8px; border: 1px solid #cbd8e2; border-radius: 8px; }
  .fset .l2 { margin-top: 8px; }
  .fset .l2 label { display: block; font-size: 13px; color: #7a8fa0; margin-bottom: 4px; }
  .fset .l2 input { width: 100%; }
  .fset .rm { background: #f7e9e7; color: #b0392f; border-radius: 8px; padding: 8px 12px; font-size: 16px; font-weight: 700; }
  .note { background: #fff8e1; border-left: 4px solid #ffb300; padding: 10px; font-size: 14px; border-radius: 6px; margin: 10px 0; line-height: 1.6; }
  .ver { text-align: center; color: #9db1bf; font-size: 12px; padding: 6px 0 14px; }

  /* ===== スマホ幅 ===== */
  @media (max-width: 480px) {
    .head { padding: 12px 12px 16px; }
    .head h1 { font-size: 19px; }
    .head p { font-size: 12px; }
    .ownbox { margin: -8px 8px 0; }
    .ownbox .v { font-size: 30px; }
    .board { margin: 10px 8px; padding: 14px 10px; }
    .board .num { font-size: 56px; }
    .board .callout { font-size: 15px; }
    .sect { margin: 0 10px 8px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 8px; padding: 0 8px 10px; }
    .fish { padding: 13px 6px; }
    .fish .nm { font-size: 18px; }
    .fish .pt { font-size: 13px; }
    .listwrap { padding: 0 8px 88px; }
    .item .t, .item .p { font-size: 17px; }
    .bottom { gap: 6px; padding: 6px; }
    .bottom button { font-size: 15px; padding: 14px 2px; }
    .chips { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
    .chips button { font-size: 15px; padding: 14px 4px; }
    .preview { font-size: 17px; }
    .disp { font-size: 36px; }
    .pad button { padding: 16px 0; font-size: 24px; }
  }
</style>
</head>
<body>

<div class="head">
  <h1 id="ttl">釣りポイント計算</h1>
  <p>釣りたいお魚と調理法を選ぶと、残りのポイントがわかります</p>
</div>

<div class="ownbox">
  <button id="btnOwned">
    <span class="l">お持ちのポイント<small>レシートに書かれている数字を入れてください</small></span>
    <span class="v" id="ownVal"><span class="tap">タップして入力</span></span>
  </button>
</div>

<div class="board" id="board">
  <div class="lbl">残りポイント</div>
  <div class="num" id="num">0<span class="u">pt</span></div>
  <div class="sub" id="sub">まだお魚を選んでいません</div>
  <div class="callout" id="callout"></div>
</div>

<div class="sect">釣りたいお魚をタップ</div>
<div class="grid" id="grid"></div>

<div class="listwrap">
  <div class="sect" style="margin-left:2px">選んだお魚と調理法</div>
  <div id="items"></div>
</div>

<div class="bottom">
  <button id="btnUndo">1つ取消</button>
  <button class="main" id="btnReset">最初から</button>
</div>

<!-- 調理法えらび -->
<div class="mask" id="mCook">
  <div class="modal">
    <h2 id="ckTitle">タイ</h2>
    <p class="hint">調理法をタップしてください。<br><b>2つ選ぶと、半分ずつ2種類</b>の調理になります。</p>
    <div class="chips" id="ckList"></div>
    <div class="preview" id="ckPrev">調理法を選んでください</div>
    <div class="row">
      <button data-close="mCook">やめる</button>
      <button id="ckSkip">あとで決める</button>
    </div>
    <div class="row"><button class="ok" id="ckOk" disabled>これにする</button></div>
  </div>
</div>

<!-- テンキー -->
<div class="mask" id="mKeypad">
  <div class="modal">
    <h2 id="kpTitle">ポイントを入力</h2>
    <div class="disp" id="kpDisp">0</div>
    <div class="pad" id="kpPad">
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="." class="act">.</button><button data-k="0">0</button><button data-k="bs" class="act">⌫</button>
    </div>
    <div class="row">
      <button data-close="mKeypad">やめる</button>
      <button class="ok" id="kpOk">決定</button>
    </div>
  </div>
</div>

<!-- 設定（スタッフ用・タイトル5回タップで開く） -->
<div class="mask" id="mSet">
  <div class="modal">
    <h2>スタッフ設定</h2>
    <div class="note">
      調理法は「、」（読点）で区切って入力してください。<br>
      例）刺身、炙り、カルパッチョ、塩焼き、煮付け
    </div>
    <div id="fsetList"></div>
    <div class="row"><button id="btnAddFish">＋ 魚を追加</button></div>
    <div class="row"><button id="btnDefault" style="background:#eef4f8">初期値に戻す</button></div>
    <div class="row"><button class="ok" id="btnSetOk">保存して閉じる</button></div>
    <div class="ver">釣りポイント計算 お客様用 v3.0</div>
  </div>
</div>

<script>
(function () {
  var KEY = 'zauo_fish_points_guest_v3';

  /* 調理法は店舗の説明表に合わせて設定画面から変更できます（初期値は暫定） */
  function defFish() {
    return [
      { id: 'f1', name: 'サザエ',   p2: 2,  cook: ['刺身', 'つぼ焼き'] },
      { id: 'f2', name: '車海老',   p2: 2,  cook: ['刺身', '塩焼き', '唐揚げ', '寿司'] },
      { id: 'f3', name: 'アジ',     p2: 4,  cook: ['活き造り', '唐揚げ', 'なめろう', '塩焼き'] },
      { id: 'f4', name: 'タイ',     p2: 14, cook: ['刺身', '炙り', 'カルパッチョ', '塩焼き', 'バジル焼き', '煮付け', '酒蒸し', 'バターソテー'] },
      { id: 'f5', name: 'ヒラメ',   p2: 16, cook: ['刺身', '炙り', 'カルパッチョ', '塩焼き', '煮付け', 'バターソテー'] },
      { id: 'f6', name: 'シマアジ', p2: 24, cook: ['刺身', '炙り', 'カルパッチョ', '塩焼き', '煮付け'] },
      { id: 'f7', name: '伊勢海老', p2: 0,  custom: true, cook: ['活き造り', 'スチーム', '具足煮', '味噌汁'] }
    ];
  }

  var S = { owned2: 0, items: [], fish: defFish() };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (o && o.fish && o.items) S = o;
    } catch (e) {}
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  /* ポイントは内部で「×2の整数」で保持（0.5刻みを誤差なく扱うため） */
  function fmt(p2) {
    var v = p2 / 2;
    return (v % 1 === 0) ? String(v) : v.toFixed(1);
  }
  function used2() {
    var s = 0;
    for (var i = 0; i < S.items.length; i++) s += S.items[i].p2;
    return s;
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ================= 描画 ================= */
  function render() {
    var u = used2(), rest = S.owned2 - u;

    document.getElementById('ownVal').innerHTML = S.owned2 > 0
      ? fmt(S.owned2) + '<em>pt</em>'
      : '<span class="tap">タップして入力</span>';

    document.getElementById('num').innerHTML = fmt(rest) + '<span class="u">pt</span>';

    var board = document.getElementById('board'), callout = document.getElementById('callout');
    if (rest < 0) {
      board.className = 'board short';
      callout.innerHTML = 'ポイントが ' + fmt(-rest) + 'pt 足りません<br>' +
        '<span style="font-weight:500;font-size:14px">ポイントの追加はスタッフにお声がけください</span>';
    } else {
      board.className = 'board';
    }
    document.getElementById('sub').textContent = S.items.length
      ? '選んだお魚 ' + S.items.length + '匹 ／ 使用 ' + fmt(u) + 'pt'
      : (S.owned2 > 0 ? 'お魚を選んでみましょう' : 'まずはお持ちのポイントを入れてください');

    renderGrid(rest);
    renderItems();
    save();
  }

  function renderGrid(rest) {
    var g = document.getElementById('grid'), h = '', i, f;
    for (i = 0; i < S.fish.length; i++) {
      f = S.fish[i];
      h += '<button class="fish' + (f.custom ? ' cst' : (f.p2 > rest ? ' over' : '')) + '" data-add="' + f.id + '">' +
             '<span class="nm">' + esc(f.name) + '</span>' +
             '<span class="pt">' + (f.custom ? '大きさで変わります' : fmt(f.p2) + ' pt') + '</span>' +
           '</button>';
    }
    g.innerHTML = h;
  }

  function renderItems() {
    var w = document.getElementById('items'), h = '', i, it;
    if (!S.items.length) {
      w.innerHTML = '<div class="empty">まだ選んでいません。<br>上のお魚をタップしてください。</div>';
      return;
    }
    for (i = S.items.length - 1; i >= 0; i--) {
      it = S.items[i];
      h += '<div class="item"><div class="t">' + esc(it.name) +
             (it.cook
               ? '<small>' + esc(it.cook) + '</small>'
               : '<small class="non">調理法はあとで</small>') +
           '</div>' +
           '<div class="p">' + fmt(it.p2) + ' pt</div>' +
           '<button class="del" data-del="' + i + '">×</button></div>';
    }
    w.innerHTML = h;
  }

  /* ================= 調理法えらび ================= */
  var ckFish = null, ckSel = [];

  function findFish(id) {
    for (var i = 0; i < S.fish.length; i++) if (S.fish[i].id === id) return S.fish[i];
    return null;
  }
  function cookLabel() {
    if (ckSel.length === 0) return '';
    if (ckSel.length === 1) return '丸ごと' + ckSel[0];
    return ckSel[0] + 'と' + ckSel[1];
  }
  function openCook(f) {
    ckFish = f; ckSel = [];
    document.getElementById('ckTitle').textContent =
      f.name + (f.custom ? '' : '　' + fmt(f.p2) + 'pt');
    renderChips();
    openM('mCook');
  }
  function renderChips() {
    var w = document.getElementById('ckList'), h = '', i, c, list = ckFish.cook || [];
    for (i = 0; i < list.length; i++) {
      c = list[i];
      h += '<button data-c="' + esc(c) + '"' + (indexOfSel(c) >= 0 ? ' class="sel"' : '') + '>' + esc(c) + '</button>';
    }
    w.innerHTML = h || '<div class="empty">調理法が登録されていません</div>';

    var pv = document.getElementById('ckPrev');
    if (ckSel.length === 0) {
      pv.innerHTML = '<span style="color:#8ba0af;font-weight:600">調理法を選んでください</span>';
    } else if (ckSel.length === 1) {
      pv.innerHTML = esc(ckFish.name) + '（丸ごと' + esc(ckSel[0]) + '）<small>もう1つ選ぶと、半分ずつ2種類にできます</small>';
    } else {
      pv.innerHTML = esc(ckFish.name) + '（' + esc(ckSel[0]) + 'と' + esc(ckSel[1]) + '）<small>半分ずつ2種類の調理</small>';
    }
    document.getElementById('ckOk').disabled = (ckSel.length === 0);
  }
  function indexOfSel(c) {
    for (var i = 0; i < ckSel.length; i++) if (ckSel[i] === c) return i;
    return -1;
  }
  document.getElementById('ckList').addEventListener('click', function (e) {
    var c = e.target.getAttribute && e.target.getAttribute('data-c');
    if (!c) return;
    var i = indexOfSel(c);
    if (i >= 0) ckSel.splice(i, 1);
    else {
      ckSel.push(c);
      if (ckSel.length > 2) ckSel.shift(); /* 3つ目を選んだら古いほうを外す */
    }
    renderChips();
  });
  function pushFish(cookText) {
    var f = ckFish;
    closeM('mCook');
    if (f.custom) {
      keypad(f.name + ' のポイント', 0, function (p2) {
        if (p2 <= 0) return;
        S.items.push({ name: f.name, cook: cookText, p2: p2 });
        render();
      });
      return;
    }
    S.items.push({ name: f.name, cook: cookText, p2: f.p2 });
    render();
  }
  document.getElementById('ckOk').onclick = function () { pushFish(cookLabel()); };
  document.getElementById('ckSkip').onclick = function () { pushFish(''); };

  function closestAttr(el, root, attr) {
    while (el && el !== root) {
      if (el.getAttribute && el.getAttribute(attr) !== null) return el;
      el = el.parentNode;
    }
    return null;
  }
  document.getElementById('grid').addEventListener('click', function (e) {
    var b = closestAttr(e.target, this, 'data-add');
    if (!b) return;
    var f = findFish(b.getAttribute('data-add'));
    if (f) openCook(f);
  });
  document.getElementById('items').addEventListener('click', function (e) {
    var b = closestAttr(e.target, this, 'data-del');
    if (!b) return;
    var i = parseInt(b.getAttribute('data-del'), 10);
    if (!isNaN(i)) { S.items.splice(i, 1); render(); }
  });
  document.getElementById('btnUndo').onclick = function () {
    if (S.items.length) { S.items.pop(); render(); }
  };
  document.getElementById('btnReset').onclick = function () {
    if (!confirm('入力をすべて消して、最初からやり直しますか？')) return;
    S.owned2 = 0; S.items = [];
    render();
    keypad('お持ちのポイント', 0, function (p2) { S.owned2 = p2; render(); });
  };

  /* ================= テンキー ================= */
  var kpBuf = '0', kpCb = null;
  function keypad(title, initP2, cb) {
    kpBuf = initP2 ? fmt(initP2) : '0';
    kpCb = cb;
    document.getElementById('kpTitle').textContent = title;
    document.getElementById('kpDisp').textContent = kpBuf;
    openM('mKeypad');
  }
  document.getElementById('kpPad').addEventListener('click', function (e) {
    var k = e.target.getAttribute('data-k');
    if (!k) return;
    if (k === 'bs') { kpBuf = kpBuf.length > 1 ? kpBuf.slice(0, -1) : '0'; }
    else if (k === '.') { if (kpBuf.indexOf('.') < 0) kpBuf += '.'; }
    else { kpBuf = (kpBuf === '0') ? k : kpBuf + k; }
    document.getElementById('kpDisp').textContent = kpBuf;
  });
  document.getElementById('kpOk').onclick = function () {
    var v = parseFloat(kpBuf);
    if (isNaN(v) || v < 0) v = 0;
    closeM('mKeypad');
    if (kpCb) kpCb(Math.round(v * 2));
  };
  document.getElementById('btnOwned').onclick = function () {
    keypad('お持ちのポイント', S.owned2, function (p2) { S.owned2 = p2; render(); });
  };

  /* ================= スタッフ設定（タイトル5回タップ） ================= */
  var tapCount = 0, tapTimer = null;
  document.getElementById('ttl').addEventListener('click', function () {
    tapCount++;
    if (tapTimer) clearTimeout(tapTimer);
    tapTimer = setTimeout(function () { tapCount = 0; }, 2500);
    if (tapCount >= 5) { tapCount = 0; renderSet(); openM('mSet'); }
  });

  function renderSet() {
    var w = document.getElementById('fsetList'), h = '', i, f;
    for (i = 0; i < S.fish.length; i++) {
      f = S.fish[i];
      h += '<div class="fset" data-i="' + i + '">' +
             '<div class="l1">' +
               '<input type="text" class="sName" value="' + esc(f.name) + '">' +
               '<input type="number" class="sFull" step="0.5" min="0" value="' + (f.custom ? '' : (f.p2 / 2)) + '"' + (f.custom ? ' disabled' : '') + '> pt' +
               '<button class="rm" data-rm="' + i + '">削除</button>' +
             '</div>' +
             '<div class="l2"><label>調理法（、で区切る）' +
               (f.custom ? '　※ポイントはその場で手入力' : '') + '</label>' +
               '<input type="text" class="sCook" value="' + esc((f.cook || []).join('、')) + '"></div>' +
           '</div>';
    }
    w.innerHTML = h;
  }
  function readSet() {
    var rows = document.getElementById('fsetList').getElementsByClassName('fset'), i, j;
    for (i = 0; i < rows.length; i++) {
      var idx = parseInt(rows[i].getAttribute('data-i'), 10), f = S.fish[idx];
      if (!f) continue;
      var nm = rows[i].getElementsByClassName('sName')[0].value.replace(/^\s+|\s+$/g, '');
      if (nm) f.name = nm;
      if (!f.custom) {
        var full = parseFloat(rows[i].getElementsByClassName('sFull')[0].value);
        if (!isNaN(full) && full >= 0) f.p2 = Math.round(full * 2);
      }
      var raw = rows[i].getElementsByClassName('sCook')[0].value.split(/[、,]/), out = [];
      for (j = 0; j < raw.length; j++) {
        var t = raw[j].replace(/^\s+|\s+$/g, '');
        if (t) out.push(t);
      }
      f.cook = out;
    }
  }
  document.getElementById('fsetList').addEventListener('click', function (e) {
    if (!e.target.getAttribute) return;
    var i = e.target.getAttribute('data-rm');
    if (i === null) return;
    if (!confirm('この魚を一覧から削除しますか？')) return;
    readSet();
    S.fish.splice(parseInt(i, 10), 1);
    renderSet(); save();
  });
  document.getElementById('btnAddFish').onclick = function () {
    readSet();
    S.fish.push({ id: 'f' + (new Date()).getTime(), name: '新しい魚', p2: 2, cook: ['刺身', '塩焼き'] });
    renderSet();
  };
  document.getElementById('btnDefault').onclick = function () {
    if (!confirm('魚・ポイント・調理法を初期状態に戻しますか？')) return;
    S.fish = defFish(); renderSet(); save();
  };
  document.getElementById('btnSetOk').onclick = function () { readSet(); closeM('mSet'); render(); };

  /* ================= モーダル共通 ================= */
  function openM(id) { document.getElementById(id).className = 'mask on'; }
  function closeM(id) { document.getElementById(id).className = 'mask'; }
  var cl = document.querySelectorAll('[data-close]');
  for (var ci = 0; ci < cl.length; ci++) {
    (function (el) { el.onclick = function () { closeM(el.getAttribute('data-close')); }; })(cl[ci]);
  }

  load();
  render();
})();
</script>
</body>
</html>
