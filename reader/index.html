<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#123a2e">
<title>レシート読み取り（店側）</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: #eef4f1; color: #14212b;
    touch-action: manipulation; -webkit-text-size-adjust: 100%;
  }
  button { font-family: inherit; border: none; cursor: pointer; }
  .hide { display: none !important; }

  .head { background: #123a2e; color: #fff; padding: 13px 16px; text-align: center; }
  .head h1 { margin: 0; font-size: 20px; }
  .head p { margin: 5px 0 0; font-size: 13px; opacity: .85; }

  .wrap { padding: 12px; padding-bottom: 96px; }
  .card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
  .card h2 { margin: 0 0 10px; font-size: 16px; color: #33566d; }

  .guide { background: #fff8e1; border-left: 4px solid #ffb300; padding: 12px; border-radius: 8px; font-size: 14px; line-height: 1.7; }
  .guide b { color: #a06800; }

  .shoot { width: 100%; padding: 22px; font-size: 21px; font-weight: 800; color: #fff; background: #1d7a5f; border-radius: 14px; }
  .shoot:active { filter: brightness(.9); }
  .sub-btn { width: 100%; margin-top: 10px; padding: 14px; font-size: 16px; font-weight: 700; background: #eef4f1; color: #2d4a41; border-radius: 12px; }

  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 12px; }
  .shot { position: relative; border-radius: 10px; overflow: hidden; border: 2px solid #d6e2dd; background: #000; }
  .shot img { width: 100%; height: 120px; object-fit: cover; display: block; }
  .shot .no { position: absolute; left: 4px; top: 4px; background: rgba(18,58,46,.85); color: #fff; font-size: 12px; font-weight: 800; padding: 3px 7px; border-radius: 6px; }
  .shot .rm { position: absolute; right: 4px; top: 4px; background: rgba(198,40,40,.9); color: #fff; font-size: 14px; font-weight: 800; padding: 3px 9px; border-radius: 6px; }

  .total { text-align: center; padding: 6px 0 2px; }
  .total .lbl { font-size: 14px; color: #5b7385; font-weight: 700; }
  .total .num { font-size: 62px; font-weight: 800; line-height: 1.05; color: #12633f; }
  .total .num .u { font-size: 20px; margin-left: 4px; }

  .line { display: flex; align-items: center; gap: 10px; padding: 11px 4px; border-bottom: 1px solid #eef2f0; }
  .line:last-child { border-bottom: none; }
  .line .t { flex: 1; font-size: 17px; font-weight: 700; }
  .line .t small { display: block; font-size: 13px; font-weight: 500; color: #8ba0af; margin-top: 2px; }
  .line .p { font-size: 17px; font-weight: 800; color: #1d7a5f; white-space: nowrap; }
  .line .rm { background: #f2f5f7; color: #b0392f; font-size: 17px; font-weight: 800; border-radius: 8px; padding: 7px 13px; }
  .line.low { background: #fffbe9; }
  .line.low .t:after { content: " 要確認"; color: #b58a2b; font-size: 12px; font-weight: 800; }

  .alert { border: 2px solid #e0b4ae; background: #fdf1ef; }
  .alert h2 { color: #b0392f; }
  .alert .p { color: #b0392f; }
  .alert .why { font-size: 13px; color: #8a5a53; line-height: 1.7; margin-top: 8px; }

  .foldbtn { width: 100%; text-align: left; background: transparent; font-size: 14px; color: #5b7385; font-weight: 700; padding: 4px; }

  .bottom { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 8px; background: rgba(238,244,241,.96); border-top: 1px solid #d6e2dd; }
  .bottom button { flex: 1; padding: 17px 4px; font-size: 17px; font-weight: 800; border-radius: 12px; background: #fff; color: #14212b; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .bottom button.main { background: #123a2e; color: #fff; }
  .bottom button[disabled] { background: #c8d4cf; color: #7d8b86; box-shadow: none; }

  .busy { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(255,255,255,.92); display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 60; }
  .busy.on { display: flex; }
  .busy .sp { width: 44px; height: 44px; border: 5px solid #cfe0d9; border-top-color: #1d7a5f; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .busy p { font-size: 16px; font-weight: 700; color: #2d4a41; margin-top: 14px; }

  .err { background: #fdecea; color: #b0392f; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 700; line-height: 1.6; }

  .manual .fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .manual .fgrid button { padding: 14px 4px; font-size: 17px; font-weight: 800; background: #eef4f1; border-radius: 12px; }
  .manual .fgrid button span { display: block; font-size: 12px; font-weight: 700; color: #5b7385; margin-top: 3px; }

  .done { text-align: center; padding: 30px 10px; }
  .done .mk { font-size: 54px; }
  .done p { font-size: 19px; font-weight: 800; margin: 10px 0 0; }

  @media (max-width: 480px) {
    .head h1 { font-size: 18px; }
    .total .num { font-size: 52px; }
    .shot img { height: 96px; }
  }
</style>
</head>
<body>

<div class="head">
  <h1>レシート読み取り</h1>
  <p id="headSub">チケットの枚数を数えます</p>
</div>

<!-- ============ 画面1：撮る ============ -->
<div class="wrap" id="scShoot">
  <div class="card">
    <div class="guide">
      レシートを<b>上から順に</b>撮ってください。<br>
      長いレシートは <b>2〜3枚に分けて</b>、<b>少し重ねて</b>撮ります。<br>
      重なった行はこちらで自動的に取り除きます。
    </div>
  </div>

  <div class="card">
    <button class="shoot" id="btnShoot">📷　写真を撮る</button>
    <input id="file" type="file" accept="image/*" capture="environment" class="hide">
    <button class="sub-btn" id="btnManual">カメラを使わず手で入力する</button>
    <div class="shots" id="shots"></div>
  </div>

  <div id="shootErr"></div>
</div>

<!-- ============ 画面2：結果 ============ -->
<div class="wrap hide" id="scResult">
  <div class="card">
    <div class="total">
      <div class="lbl">チケット合計</div>
      <div class="num" id="totalNum">0<span class="u">枚</span></div>
      <div class="lbl" id="totalSub"></div>
    </div>
  </div>

  <div class="card">
    <h2>チケットで釣った魚（0円）</h2>
    <div id="ticketList"></div>
  </div>

  <div class="card alert hide" id="paidCard">
    <h2>⚠ 料金がついている魚があります</h2>
    <div id="paidList"></div>
    <div class="why">
      本来チケットで釣れる魚に料金がついている可能性があります。<br>
      <b>お客様が単品で追加注文した場合は正しい計上です。</b>
      伝票を見て確かめてください。
    </div>
  </div>

  <div class="card">
    <button class="foldbtn" id="btnFold">▶ 魚以外の明細を見る（<span id="otherCount">0</span>件）</button>
    <div id="otherList" class="hide"></div>
  </div>

  <div id="resultErr"></div>
</div>

<!-- ============ 画面3：手入力 ============ -->
<div class="wrap hide manual" id="scManual">
  <div class="card">
    <h2>魚をタップして数えてください</h2>
    <div class="fgrid" id="manualGrid"></div>
  </div>
  <div class="card">
    <div class="total">
      <div class="lbl">チケット合計</div>
      <div class="num" id="manualNum">0<span class="u">枚</span></div>
    </div>
    <div id="manualList"></div>
  </div>
</div>

<!-- ============ 画面4：完了 ============ -->
<div class="wrap hide" id="scDone">
  <div class="card done">
    <div class="mk">✅</div>
    <p>登録しました</p>
    <div class="lbl" id="doneSub" style="margin-top:8px;color:#5b7385;font-size:14px"></div>
  </div>
</div>

<div class="bottom" id="bar"></div>

<div class="busy" id="busy"><div class="sp"></div><p id="busyMsg">読み取っています…</p></div>

<script>
(function () {
  /* ===== 設定 =====
     GAS をデプロイしたら、下の GAS_URL に /exec のURLを貼ってください。 */
  var GAS_URL = '';

  /* 合言葉。GAS側のスクリプトプロパティ PASSCODE と同じ文字列にする。
     公開URLなので、これが無いと第三者に読み取りを実行されAI利用料がかかる。 */
  var PASSCODE = '';

  var MAX_EDGE = 1600;   /* 長辺1600pxに縮小して送る（通信量とAIのトークン量を抑える） */

  /* 手入力モード用。GAS側の POINTS と同じ内容にしておくこと */
  var FISH = [
    { name: 'サザエ', pt: 1 },
    { name: '車海老', pt: 1 },
    { name: 'アジ', pt: 2 },
    { name: 'タイ', pt: 7 },
    { name: 'ヒラメ', pt: 8 },
    { name: 'シマアジ', pt: 12 }
  ];

  var shots = [];        /* { dataUrl, base64 } */
  var result = null;     /* GASからの読み取り結果 */
  var manual = [];       /* 手入力モードの内訳 */
  var screen = 'shoot';

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function show(name) {
    screen = name;
    var ids = { shoot: 'scShoot', result: 'scResult', manual: 'scManual', done: 'scDone' };
    for (var k in ids) {
      if (ids.hasOwnProperty(k)) $(ids[k]).className = (k === name) ? 'wrap' + (k === 'manual' ? ' manual' : '') : 'wrap hide' + (k === 'manual' ? ' manual' : '');
    }
    $('headSub').textContent = {
      shoot: 'チケットの枚数を数えます',
      result: '内容を確かめてから登録してください',
      manual: '手入力モード',
      done: ''
    }[name];
    renderBar();
    window.scrollTo(0, 0);
  }
  function busy(on, msg) {
    $('busy').className = on ? 'busy on' : 'busy';
    if (msg) $('busyMsg').textContent = msg;
  }
  function errBox(id, msg) {
    $(id).innerHTML = msg ? '<div class="err">' + esc(msg) + '</div>' : '';
  }

  /* ================= 撮影 ================= */
  $('btnShoot').onclick = function () { $('file').click(); };
  $('file').onchange = function (e) {
    var f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    errBox('shootErr', '');
    busy(true, '写真を取り込んでいます…');
    shrink(f, function (dataUrl) {
      busy(false);
      if (!dataUrl) { errBox('shootErr', '写真を読み込めませんでした。もう一度撮ってください。'); return; }
      shots.push({ dataUrl: dataUrl, base64: dataUrl.split(',')[1] });
      renderShots();
      renderBar();
    });
  };

  /** 長辺1600pxのJPEGにしてから送る */
  function shrink(file, cb) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height, s = Math.min(1, MAX_EDGE / Math.max(w, h));
        var cv = document.createElement('canvas');
        cv.width = Math.round(w * s);
        cv.height = Math.round(h * s);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        cb(cv.toDataURL('image/jpeg', 0.88));
      };
      img.onerror = function () { cb(null); };
      img.src = fr.result;
    };
    fr.onerror = function () { cb(null); };
    fr.readAsDataURL(file);
  }

  function renderShots() {
    var h = '', i;
    for (i = 0; i < shots.length; i++) {
      h += '<div class="shot"><img src="' + shots[i].dataUrl + '">' +
           '<span class="no">' + (i + 1) + '枚目</span>' +
           '<button class="rm" data-rmshot="' + i + '">×</button></div>';
    }
    $('shots').innerHTML = h;
  }
  $('shots').addEventListener('click', function (e) {
    var i = e.target.getAttribute && e.target.getAttribute('data-rmshot');
    if (i === null || i === undefined) return;
    shots.splice(parseInt(i, 10), 1);
    renderShots();
    renderBar();
  });

  /* ================= 送信 ================= */
  function post(obj, cb) {
    if (!GAS_URL) {
      cb({ ok: false, error: 'GAS_URL が設定されていません。index.html の先頭に /exec の URL を貼ってください。' });
      return;
    }
    /* 日本語の文字化けを防ぐため Base64 にして送る（シフト管理と同じ方式） */
    obj.passcode = PASSCODE;
    var b64 = btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
    fetch(GAS_URL, { method: 'POST', body: b64 })
      .then(function (r) { return r.json(); })
      .then(cb)
      .catch(function (err) { cb({ ok: false, error: '通信に失敗しました: ' + err }); });
  }

  function doRead() {
    if (!shots.length) return;
    errBox('shootErr', '');
    busy(true, 'レシートを読み取っています…');
    var imgs = [], i;
    for (i = 0; i < shots.length; i++) imgs.push(shots[i].base64);
    post({ action: 'read', images: imgs }, function (res) {
      busy(false);
      if (!res || !res.ok) {
        errBox('shootErr', (res && res.error) || '読み取りに失敗しました');
        return;
      }
      result = res;
      renderResult();
      show('result');
    });
  }

  function doCommit() {
    busy(true, '登録しています…');
    post({ action: 'commit', result: result }, function (res) {
      busy(false);
      if (!res || !res.ok) { errBox('resultErr', (res && res.error) || '登録に失敗しました'); return; }
      $('doneSub').textContent = 'チケット合計 ' + result.合計 + ' 枚';
      show('done');
    });
  }

  /* ================= 結果表示 ================= */
  function renderResult() {
    var t = result.チケット || [], p = result.有料 || [], o = result.その他 || [], i, r, h;

    $('totalNum').innerHTML = result.合計 + '<span class="u">枚</span>';
    $('totalSub').textContent = t.length + '匹　／　写真 ' + (result.枚数 || shots.length) + '枚' +
      (result.重複除去 ? '（重なり ' + result.重複除去 + '行を除きました）' : '');

    h = '';
    for (i = 0; i < t.length; i++) {
      r = t[i];
      h += '<div class="line' + (r.確信度 === '低' ? ' low' : '') + '">' +
             '<div class="t">' + esc(r.魚) + (r.数量 > 1 ? ' ×' + r.数量 : '') +
               '<small>' + esc(r.品名) + '</small></div>' +
             '<div class="p">' + r.小計 + '枚</div>' +
             '<button class="rm" data-rmt="' + i + '">×</button>' +
           '</div>';
    }
    $('ticketList').innerHTML = h || '<div class="line"><div class="t" style="color:#8ba0af">チケットの魚は見つかりませんでした</div></div>';

    if (p.length) {
      $('paidCard').className = 'card alert';
      h = '';
      for (i = 0; i < p.length; i++) {
        r = p[i];
        h += '<div class="line"><div class="t">' + esc(r.魚) + (r.数量 > 1 ? ' ×' + r.数量 : '') +
               '<small>' + esc(r.品名) + '</small></div>' +
             '<div class="p">' + r.金額 + '円</div></div>';
      }
      $('paidList').innerHTML = h;
    } else {
      $('paidCard').className = 'card alert hide';
    }

    $('otherCount').textContent = o.length;
    h = '';
    for (i = 0; i < o.length; i++) {
      h += '<div class="line"><div class="t">' + esc(o[i].品名) + '</div>' +
           '<div class="p" style="color:#8ba0af">' + (o[i].金額 || 0) + '円</div></div>';
    }
    $('otherList').innerHTML = h || '<div class="line"><div class="t" style="color:#8ba0af">ありません</div></div>';
  }

  $('ticketList').addEventListener('click', function (e) {
    var i = e.target.getAttribute && e.target.getAttribute('data-rmt');
    if (i === null || i === undefined) return;
    var r = result.チケット.splice(parseInt(i, 10), 1)[0];
    result.合計 -= r.小計;
    renderResult();
  });

  $('btnFold').onclick = function () {
    var el = $('otherList'), open = el.className.indexOf('hide') < 0;
    el.className = open ? 'hide' : '';
    $('btnFold').innerHTML = (open ? '▶' : '▼') + ' 魚以外の明細を見る（<span id="otherCount">' +
      ((result.その他 || []).length) + '</span>件）';
  };

  /* ================= 手入力モード ================= */
  $('btnManual').onclick = function () { manual = []; renderManual(); show('manual'); };

  function renderManual() {
    var h = '', i;
    for (i = 0; i < FISH.length; i++) {
      h += '<button data-add="' + i + '">' + esc(FISH[i].name) + '<span>' + FISH[i].pt + '枚</span></button>';
    }
    $('manualGrid').innerHTML = h;

    var tot = 0;
    h = '';
    for (i = manual.length - 1; i >= 0; i--) {
      tot += manual[i].pt;
      h += '<div class="line"><div class="t">' + esc(manual[i].name) + '</div>' +
           '<div class="p">' + manual[i].pt + '枚</div>' +
           '<button class="rm" data-rmm="' + i + '">×</button></div>';
    }
    $('manualNum').innerHTML = tot + '<span class="u">枚</span>';
    $('manualList').innerHTML = h || '<div class="line"><div class="t" style="color:#8ba0af">まだありません</div></div>';
  }
  $('manualGrid').addEventListener('click', function (e) {
    var b = e.target;
    while (b && b !== this && !b.getAttribute('data-add')) b = b.parentNode;
    var i = b && b.getAttribute('data-add');
    if (i === null || i === undefined) return;
    manual.push({ name: FISH[parseInt(i, 10)].name, pt: FISH[parseInt(i, 10)].pt });
    renderManual();
  });
  $('manualList').addEventListener('click', function (e) {
    var i = e.target.getAttribute && e.target.getAttribute('data-rmm');
    if (i === null || i === undefined) return;
    manual.splice(parseInt(i, 10), 1);
    renderManual();
  });

  /* ================= 下部ボタン ================= */
  function renderBar() {
    var h = '';
    if (screen === 'shoot') {
      h = '<button id="bReset">すべて消す</button>' +
          '<button class="main" id="bRead"' + (shots.length ? '' : ' disabled') + '>' +
          (shots.length ? shots.length + '枚を読み取る' : '写真を撮ってください') + '</button>';
    } else if (screen === 'result') {
      h = '<button id="bBack">撮り直す</button><button class="main" id="bCommit">確定して登録</button>';
    } else if (screen === 'manual') {
      h = '<button id="bBack2">カメラに戻る</button><button class="main" id="bManualDone">この枚数で確定</button>';
    } else {
      h = '<button class="main" id="bNew">次のお客様</button>';
    }
    $('bar').innerHTML = h;

    if ($('bReset')) $('bReset').onclick = function () {
      if (!shots.length || !confirm('撮った写真をすべて消しますか？')) return;
      shots = []; renderShots(); renderBar();
    };
    if ($('bRead')) $('bRead').onclick = doRead;
    if ($('bBack')) $('bBack').onclick = function () { show('shoot'); };
    if ($('bCommit')) $('bCommit').onclick = doCommit;
    if ($('bBack2')) $('bBack2').onclick = function () { show('shoot'); };
    if ($('bManualDone')) $('bManualDone').onclick = function () {
      var tot = 0, i, list = [];
      for (i = 0; i < manual.length; i++) {
        tot += manual[i].pt;
        list.push({ 魚: manual[i].name, 品名: '（手入力）', 数量: 1, 小計: manual[i].pt, 確信度: '高' });
      }
      result = { ok: true, 合計: tot, チケット: list, 有料: [], その他: [], 枚数: 0, 手入力: true };
      renderResult();
      show('result');
    };
    if ($('bNew')) $('bNew').onclick = function () {
      shots = []; result = null; manual = [];
      renderShots(); errBox('shootErr', ''); errBox('resultErr', '');
      show('shoot');
    };
  }

  show('shoot');
})();
</script>
</body>
</html>
